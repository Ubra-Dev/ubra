name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-arch macOS legs (not one universal build).
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bundle-macOS-arm64
            bundle_dir: src-tauri/target/aarch64-apple-darwin/release/bundle/
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: bundle-macOS-intel
            bundle_dir: src-tauri/target/x86_64-apple-darwin/release/bundle/
          - os: ubuntu-latest
            target: ""
            artifact: bundle-Linux
            bundle_dir: src-tauri/target/release/bundle/
          - os: windows-latest
            target: ""
            artifact: bundle-Windows
            bundle_dir: src-tauri/target/release/bundle/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # System dependencies from https://v2.tauri.app/start/prerequisites/
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Install isolated native smoke dependencies
        run: npm ci
        working-directory: tests/native-smoke

      - name: Check tag matches app version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $CONF_VERSION."
            exit 1
          fi

      # Refuse to ship an unsigned macOS release: without an identity the
      # bundler signs ad-hoc and Gatekeeper blocks the DMG.
      - name: Require macOS signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY is not set; refusing to ship an unsigned macOS release."
            exit 1
          fi
          if [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            echo "::error::Set exactly one notarization route: APPLE_API_KEY_P8 (preferred) or APPLE_PASSWORD."
            exit 1
          fi

      # Keychain setup from the Tauri macOS signing guide; the keychain
      # password is ephemeral (openssl rand), not a stored secret.
      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/certificate.p12
          security find-identity -v -p codesigning build.keychain

      # App Store Connect API key for notarization (preferred over Apple ID):
      # the .p8 arrives base64-encoded and is written to a temp path the
      # bundler reads via APPLE_API_KEY_PATH. Skipped when unset.
      - name: Materialize App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "No API key secret; falling back to Apple ID notarization."
            exit 0
          fi
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Verify App Store Connect API credentials
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            exit 0
          fi
          xcrun notarytool history \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json >/dev/null
          echo "Apple accepted the App Store Connect API credentials."

      # Direct CLI build (no tauri-action): bundles via the pinned
      # @tauri-apps/cli in devDependencies. With the Apple credentials set,
      # each macOS build signs, notarizes, and staples automatically.
      - name: Tauri build
        env:
          TAURI_TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Unset secrets expand to empty: telemetry stays off but the
          # frontend build (which needs these keys present) stays green.
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.PUBLIC_POSTHOG_PROJECT_TOKEN }}
        shell: bash
        run: |
          # GitHub exposes missing secrets as empty environment variables.
          # Tauri selects Apple ID auth by variable presence, so remove empty
          # values to allow the configured App Store Connect API key route.
          [ -n "$APPLE_ID" ] || unset APPLE_ID
          [ -n "$APPLE_PASSWORD" ] || unset APPLE_PASSWORD
          [ -n "$APPLE_TEAM_ID" ] || unset APPLE_TEAM_ID
          if [ -n "$TAURI_TARGET" ]; then
            npm run tauri build -- --target "$TAURI_TARGET"
          else
            npm run tauri build
          fi

      # Tauri notarizes and staples the app bundle before creating its DMG.
      # Sign, notarize, and staple the outer disk image as well so Gatekeeper
      # can verify the downloaded release container without a network lookup.
      - name: Sign, notarize, and staple macOS disk images
        if: runner.os == 'macOS'
        env:
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          shopt -s nullglob
          dmg_files=("$BUNDLE_DIR"/dmg/*.dmg)
          if [ "${#dmg_files[@]}" -eq 0 ]; then
            echo "::error::No macOS disk image found under $BUNDLE_DIR/dmg."
            exit 1
          fi
          for dmg in "${dmg_files[@]}"; do
            codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
            codesign --verify --verbose=2 "$dmg"
            if [ -n "$APPLE_API_KEY_P8" ]; then
              xcrun notarytool submit "$dmg" \
                --key "$APPLE_API_KEY_PATH" \
                --key-id "$APPLE_API_KEY" \
                --issuer "$APPLE_API_ISSUER" \
                --wait --output-format json
            else
              xcrun notarytool submit "$dmg" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait --output-format json
            fi
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      # Both macOS legs emit identically named `Ubra.app.tar.gz` updater
      # bundles; rename by arch so they survive as distinct release assets.
      - name: Disambiguate macOS updater bundle by arch
        if: runner.os == 'macOS'
        env:
          TAURI_TARGET: ${{ matrix.target }}
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
        run: |
          cd "$BUNDLE_DIR/macos"
          ls Ubra.app.tar.gz Ubra.app.tar.gz.sig
          VER="${GITHUB_REF_NAME#v}"
          ARCH="${TAURI_TARGET%%-*}"
          mv Ubra.app.tar.gz "Ubra_${VER}_${ARCH}.app.tar.gz"
          mv Ubra.app.tar.gz.sig "Ubra_${VER}_${ARCH}.app.tar.gz.sig"

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_dir }}
          if-no-files-found: error

  # Exercise the exact installer artifacts before publication. Each platform
  # installs and launches its bundle with an isolated data directory, then
  # runs the same PTY, Explorer, Source Control, and tab UI checks.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-latest
            artifact: bundle-macOS-arm64
          - name: macOS-intel
            os: macos-15-intel
            artifact: bundle-macOS-intel
          - name: Linux-x86_64
            os: ubuntu-latest
            artifact: bundle-Linux
          - name: Windows-x86_64
            os: windows-latest
            artifact: bundle-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust for Windows WebDriver
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install native smoke dependencies
        run: npm ci
        working-directory: tests/native-smoke

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: smoke-bundle

      - name: Install Linux GUI test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11

      - name: Install and locate packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          expected_arch="${{ matrix.name == 'macOS-arm64' && 'arm64' || 'x86_64' }}"
          actual_arch="$(uname -m)"
          if [ "$expected_arch" = arm64 ] && [ "$actual_arch" != arm64 ]; then
            echo "::error::Expected arm64 runner, got $actual_arch"; exit 1
          fi
          if [ "$expected_arch" = x86_64 ] && [ "$actual_arch" != x86_64 ]; then
            echo "::error::Expected Intel runner, got $actual_arch"; exit 1
          fi
          dmg="$(find smoke-bundle -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mkdir -p "$RUNNER_TEMP/ubra-dmg"
          hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$RUNNER_TEMP/ubra-dmg"
          app="$RUNNER_TEMP/ubra-dmg/Ubra.app/Contents/MacOS/ubra"
          test -x "$app"
          echo "APP_BINARY=$app" >> "$GITHUB_ENV"

      - name: Install and locate packaged app (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb="$(find smoke-bundle -name '*.deb' -print -quit)"
          test -n "$deb"
          sudo apt-get install -y "$PWD/$deb"
          test -x /usr/bin/ubra
          echo "APP_BINARY=/usr/bin/ubra" >> "$GITHUB_ENV"

      - name: Install and locate packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem smoke-bundle -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'No MSI installer found in release artifact' }
          $process = Start-Process msiexec.exe -ArgumentList @('/i', $installer.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "MSI installation failed: $($process.ExitCode)" }
          $app = Get-ChildItem 'C:\Program Files' -Filter ubra.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'Installed ubra.exe was not found under Program Files' }
          # tauri-driver hands the executable path through EdgeDriver's binary
          # capability. Keep that path free of spaces to avoid WebView2's
          # DevToolsActivePort startup failure on Windows runners.
          $smokeDir = Join-Path $env:RUNNER_TEMP 'ubra-smoke'
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Copy-Item (Join-Path $app.DirectoryName '*') $smokeDir -Recurse -Force
          $smokeApp = Join-Path $smokeDir 'ubra.exe'
          if (-not (Test-Path $smokeApp)) { throw 'Copied smoke app was not found' }
          "APP_BINARY=$smokeApp" >> $env:GITHUB_ENV

      - name: Prepare isolated PTY and git fixtures
        run: node scripts/prepare-native-smoke.mjs

      - name: Run packaged app smoke suite (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run smoke
        working-directory: tests/native-smoke
        env:
          TAURI_WEBDRIVER_PORT: 4445
          UBRA_NATIVE_SMOKE: "1"

      - name: Run packaged app smoke suite (Linux WebDriver configuration)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- env TAURI_WEBDRIVER_PORT=4445 npm run smoke
        working-directory: tests/native-smoke
        env:
          UBRA_NATIVE_SMOKE: "1"
          TAURI_WEBDRIVER_PORT: 4445

      - name: Record native smoke evidence
        if: always()
        shell: bash
        env:
          SMOKE_NAME: ${{ matrix.name }}
        run: |
          {
            echo "## Native smoke: $SMOKE_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p .native-smoke/evidence
          printf '{"commit":"%s","platform":"%s","runner_os":"%s","runner_arch":"%s","result":"%s"}\n' \
            "$GITHUB_SHA" "$SMOKE_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "${{ job.status }}" \
            > .native-smoke/evidence/result.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-smoke-${{ matrix.name }}
          path: .native-smoke/evidence/result.json
          if-no-files-found: warn
          retention-days: 90

  publish:
    needs: [build, smoke]
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bundles

      # The updater manifest generator lives in the repo (scripts/ +
      # src/lib/updaterManifest.ts); the publish job needs a checkout to run it.
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Fails closed when any platform lacks a signed updater bundle.
      - name: Generate updater metadata
        run: >
          node scripts/make-latest-json.mjs --tag "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY" --dir bundles --out bundles/latest.json

      # Stage exactly the files that become release assets: installer and
      # updater bundles plus signatures. The loose `.app` directories and
      # bundler debris (bundle_dmg.sh, icon.icns) stay out — release assets
      # share one flat namespace, so any basename collision fails the release.
      - name: Stage release assets
        run: |
          mkdir -p dist
          collide=0
          while IFS= read -r f; do
            base="$(basename "$f")"
            if [ -e "dist/$base" ]; then
              echo "::error::duplicate release asset name: $base ($f)"
              collide=1
            else
              cp "$f" "dist/$base"
            fi
          done < <(find bundles -type f \( \
            -name "*.dmg" -o -name "*.tar.gz" -o -name "*.sig" \
            -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \
            -o -name "*.exe" -o -name "*.msi" -o -name "*.zip" \
            -o -name "latest.json" \) | sort)
          [ "$collide" = "0" ] || exit 1
          ls dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Regenerate Casks/ubra.rb in Ubra-Dev/homebrew-tap from the published
  # release DMGs. Skips (without failing the release) when the tap token
  # is not configured; creates the cask on first run, updates it after.
  tap-update:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check tap token
        id: token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping tap update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.skip != 'true'

      - name: Setup Node
        if: steps.token.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download macOS DMGs
        if: steps.token.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dmg
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --dir dmg
          ls dmg

      - name: Render cask
        if: steps.token.outputs.skip != 'true'
        run: >
          node scripts/update-cask.mjs --tag "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY" --dir dmg --out /tmp/ubra.rb

      - name: Push to tap
        if: steps.token.outputs.skip != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          rm -rf tap
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Ubra-Dev/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp /tmp/ubra.rb tap/Casks/ubra.rb
          cd tap
          git config user.name "ubra-release"
          git config user.email "release@getubra.com"
          git add Casks/ubra.rb
          if git diff --cached --quiet; then
            echo "Cask already current."
            exit 0
          fi
          git commit -m "ubra ${GITHUB_REF_NAME#v}"
          git push -u origin HEAD
