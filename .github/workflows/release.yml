name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PUBLIC_POSTHOG_PROJECT_TOKEN: ""
  PUBLIC_POSTHOG_HOST: ""

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # System dependencies from https://v2.tauri.app/start/prerequisites/
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        run: node scripts/prepare-signing.mjs
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Prepare Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-signing.ps1
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # Direct CLI build (no tauri-action): bundles via the pinned
      # @tauri-apps/cli in devDependencies, with daemon + CLI sidecars.
      - name: Tauri build (macOS)
        if: runner.os == 'macOS'
        run: npm run tauri:build
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Tauri build (Linux)
        if: runner.os == 'Linux'
        run: npm run tauri:build

      - name: Tauri build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run tauri:build -- --config "$env:UBRA_SIGNING_CONFIG"

      - name: Verify signing and notarization
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: node scripts/verify-signing.mjs

      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${UBRA_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$UBRA_SIGNING_KEYCHAIN"
          fi

      - name: Remove Windows signing certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:UBRA_SIGNING_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:UBRA_SIGNING_THUMBPRINT" -Force
          }

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

      - name: Upload third-party notices and corresponding source
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: legal
          include-hidden-files: true
          path: |
            .tooling/legal/LICENSE
            .tooling/legal/THIRD_PARTY_NOTICES.txt
            .tooling/legal/dependency-inventory.json
            .tooling/legal/THIRD_PARTY_SOURCES.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # A successful build is not proof that a packaged webview/PTY works.
      # Missing evidence is deliberately a publication blocker.
      - name: Require native smoke evidence for this commit
        env:
          RELEASE_SHA: ${{ github.sha }}
          MACOS_SHA: ${{ vars.NATIVE_SMOKE_SHA_MACOS }}
          LINUX_SHA: ${{ vars.NATIVE_SMOKE_SHA_LINUX }}
          WINDOWS_SHA: ${{ vars.NATIVE_SMOKE_SHA_WINDOWS }}
        run: |
          for platform in MACOS LINUX WINDOWS; do
            case "$platform" in
              MACOS) verified_sha="$MACOS_SHA" ;;
              LINUX) verified_sha="$LINUX_SHA" ;;
              WINDOWS) verified_sha="$WINDOWS_SHA" ;;
            esac
            if [ "$verified_sha" != "$RELEASE_SHA" ]; then
              echo "::error::$platform native smoke is unverified for $RELEASE_SHA; publication is blocked."
              exit 1
            fi
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - name: Prepare downloads and SHA-256 checksums
        run: node scripts/release-checksums.mjs bundles release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
