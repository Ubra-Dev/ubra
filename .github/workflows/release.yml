name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # System dependencies from https://v2.tauri.app/start/prerequisites/
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Direct CLI build (no tauri-action): bundles via the pinned
      # @tauri-apps/cli in devDependencies.
      - name: Tauri build
        run: npm run tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  publish:
    needs: build
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # A successful build is not proof that a packaged webview/PTY works.
      # Missing evidence is deliberately a publication blocker.
      - name: Require native smoke evidence for this commit
        env:
          RELEASE_SHA: ${{ github.sha }}
          MACOS_SHA: ${{ vars.NATIVE_SMOKE_SHA_MACOS }}
          LINUX_SHA: ${{ vars.NATIVE_SMOKE_SHA_LINUX }}
          WINDOWS_SHA: ${{ vars.NATIVE_SMOKE_SHA_WINDOWS }}
        run: |
          for platform in MACOS LINUX WINDOWS; do
            case "$platform" in
              MACOS) verified_sha="$MACOS_SHA" ;;
              LINUX) verified_sha="$LINUX_SHA" ;;
              WINDOWS) verified_sha="$WINDOWS_SHA" ;;
            esac
            if [ "$verified_sha" != "$RELEASE_SHA" ]; then
              echo "::error::$platform native smoke is unverified for $RELEASE_SHA; publication is blocked."
              exit 1
            fi
          done

      - uses: actions/download-artifact@v8
        with:
          path: bundles
      - uses: softprops/action-gh-release@v2
        with:
          files: bundles/**/*
          generate_release_notes: true
