name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-arch macOS legs (not one universal build): the CLI only
          # lipo-merges the main binary, and Ubra ships sibling binaries
          # (ubra-daemon, ubra-cli) that the bundler requires.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bundle-macOS-arm64
            bundle_dir: src-tauri/target/aarch64-apple-darwin/release/bundle/
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: bundle-macOS-intel
            bundle_dir: src-tauri/target/x86_64-apple-darwin/release/bundle/
          - os: ubuntu-latest
            target: ""
            artifact: bundle-Linux
            bundle_dir: src-tauri/target/release/bundle/
          - os: windows-latest
            target: ""
            artifact: bundle-Windows
            bundle_dir: src-tauri/target/release/bundle/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # System dependencies from https://v2.tauri.app/start/prerequisites/
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check tag matches app version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $CONF_VERSION."
            exit 1
          fi

      # Refuse to ship an unsigned macOS release: without an identity the
      # bundler signs ad-hoc and Gatekeeper blocks the DMG.
      - name: Require macOS signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY is not set; refusing to ship an unsigned macOS release."
            exit 1
          fi

      # Keychain setup from the Tauri macOS signing guide; the keychain
      # password is ephemeral (openssl rand), not a stored secret.
      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/certificate.p12
          security find-identity -v -p codesigning build.keychain

      # Direct CLI build (no tauri-action): bundles via the pinned
      # @tauri-apps/cli in devDependencies. With the Apple credentials set,
      # each macOS build signs, notarizes, and staples automatically.
      - name: Tauri build
        env:
          TAURI_TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Unset secrets expand to empty: telemetry stays off but the
          # frontend build (which needs these keys present) stays green.
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.PUBLIC_POSTHOG_PROJECT_TOKEN }}
        run: |
          if [ -n "$TAURI_TARGET" ]; then
            npm run tauri build -- --target "$TAURI_TARGET"
          else
            npm run tauri build
          fi

      # Both macOS legs emit identically named `Ubra.app.tar.gz` updater
      # bundles; rename by arch so they survive as distinct release assets.
      - name: Disambiguate macOS updater bundle by arch
        if: runner.os == 'macOS'
        env:
          TAURI_TARGET: ${{ matrix.target }}
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
        run: |
          cd "$BUNDLE_DIR/macos"
          ls Ubra.app.tar.gz Ubra.app.tar.gz.sig
          VER="${GITHUB_REF_NAME#v}"
          ARCH="${TAURI_TARGET%%-*}"
          mv Ubra.app.tar.gz "Ubra_${VER}_${ARCH}.app.tar.gz"
          mv Ubra.app.tar.gz.sig "Ubra_${VER}_${ARCH}.app.tar.gz.sig"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_dir }}
          if-no-files-found: error

  publish:
    needs: build
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # A successful build is not proof that a packaged webview/PTY works.
      # Missing evidence is deliberately a publication blocker.
      - name: Require native smoke evidence for this commit
        env:
          RELEASE_SHA: ${{ github.sha }}
          MACOS_SHA: ${{ vars.NATIVE_SMOKE_SHA_MACOS }}
          LINUX_SHA: ${{ vars.NATIVE_SMOKE_SHA_LINUX }}
          WINDOWS_SHA: ${{ vars.NATIVE_SMOKE_SHA_WINDOWS }}
        run: |
          for platform in MACOS LINUX WINDOWS; do
            case "$platform" in
              MACOS) verified_sha="$MACOS_SHA" ;;
              LINUX) verified_sha="$LINUX_SHA" ;;
              WINDOWS) verified_sha="$WINDOWS_SHA" ;;
            esac
            if [ "$verified_sha" != "$RELEASE_SHA" ]; then
              echo "::error::$platform native smoke is unverified for $RELEASE_SHA; publication is blocked."
              exit 1
            fi
          done

      - uses: actions/download-artifact@v4
        with:
          path: bundles

      # The updater manifest generator lives in the repo (scripts/ +
      # src/lib/updaterManifest.ts); the publish job needs a checkout to run it.
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fails closed when any platform lacks a signed updater bundle.
      - name: Generate updater metadata
        run: >
          node scripts/make-latest-json.mjs --tag "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY" --dir bundles --out bundles/latest.json

      # Stage exactly the files that become release assets: installer and
      # updater bundles plus signatures. The loose `.app` directories and
      # bundler debris (bundle_dmg.sh, icon.icns) stay out — release assets
      # share one flat namespace, so any basename collision fails the release.
      - name: Stage release assets
        run: |
          mkdir -p dist
          collide=0
          while IFS= read -r f; do
            base="$(basename "$f")"
            if [ -e "dist/$base" ]; then
              echo "::error::duplicate release asset name: $base ($f)"
              collide=1
            else
              cp "$f" "dist/$base"
            fi
          done < <(find bundles -type f \( \
            -name "*.dmg" -o -name "*.tar.gz" -o -name "*.sig" \
            -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \
            -o -name "*.exe" -o -name "*.msi" -o -name "*.zip" \
            -o -name "latest.json" \) | sort)
          [ "$collide" = "0" ] || exit 1
          ls dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
